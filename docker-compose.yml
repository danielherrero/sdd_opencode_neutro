services:
  postgres:
    image: postgres:17-alpine
    container_name: sdd-postgresql
    environment:
      POSTGRES_DB: sdd
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: DanielHerrero1974@
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdd-user-management
    environment:
      QUARKUS_PROFILE: docker
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/sdd
      DB_USERNAME: admin
      DB_PASSWORD: DanielHerrero1974@
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
